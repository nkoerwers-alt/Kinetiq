
name: Kinetiq iPadOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iPadOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPad Simulator
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project Kinetiq.xcodeproj \
            -scheme Kinetiq \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1

          BUILD_STATUS=$?

          echo "===== IMPORTANT BUILD ERRORS ====="
          grep -n -E 'error:|fatal error:|BUILD FAILED|No such module|SwiftCompile' build.log | tail -n 50 || true

          echo "===== END OF ERROR SUMMARY ====="
          exit "$BUILD_STATUS"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kinetiq-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kinetiq-iPad-Simulator
          path: build/Build/Products/Debug-iphonesimulator/Kinetiq.app
          if-no-files-found: error
          retention-days: 7
